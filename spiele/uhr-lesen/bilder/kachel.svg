    <circle r="2.6" fill="#777"/>
    <!-- Glas-Glanz -->
    <path d="M -70 -55 A 88 88 0 0 1 40 -86 A 100 100 0 0 0 -70 -55 Z" fill="#fff" opacity=".35" pointer-events="none"/>
