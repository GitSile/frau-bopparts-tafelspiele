<svg xmlns="http://www.w3.org/2000/svg" width="216" height="224" viewBox="-108 -108 216 224" aria-label="Uhr">
    <style>.uhr-zahl{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700;fill:#111;text-anchor:middle;dominant-baseline:central}</style><defs>
      <radialGradient id="u1-blatt" cx="40%" cy="35%" r="75%">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef1f3"/>
      </radialGradient>
      <linearGradient id="u1-rand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5b6168"/><stop offset=".5" stop-color="#23272b"/><stop offset="1" stop-color="#0d0f11"/>
      </linearGradient>
      <filter id="u1-schatten" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="1.2" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity=".35"/>
      </filter>
      <filter id="u1-wand" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".28"/>
      </filter>
    </defs>
    
    <g filter="url(#u1-wand)">
      <circle r="104" fill="url(#u1-rand)"/>
      <circle r="97" fill="#c9ced3"/>
      <circle r="95.5" fill="url(#u1-blatt)"/>
    </g>
    <g class="striche"><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(0)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(30)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(60)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(90)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(120)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(150)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(180)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(210)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(240)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(270)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(300)" stroke="#111" stroke-width="5.5"/><line x1="0" y1="-76" x2="0" y2="-92" transform="rotate(330)" stroke="#111" stroke-width="5.5"/></g>
    <g class="zahlen"><text x="30.0" y="-52.0" class="uhr-zahl">1</text><text x="52.0" y="-30.0" class="uhr-zahl">2</text><text x="60.0" y="-0.0" class="uhr-zahl">3</text><text x="52.0" y="30.0" class="uhr-zahl">4</text><text x="30.0" y="52.0" class="uhr-zahl">5</text><text x="0.0" y="60.0" class="uhr-zahl">6</text><text x="-30.0" y="52.0" class="uhr-zahl">7</text><text x="-52.0" y="30.0" class="uhr-zahl">8</text><text x="-60.0" y="0.0" class="uhr-zahl">9</text><text x="-52.0" y="-30.0" class="uhr-zahl">10</text><text x="-30.0" y="-52.0" class="uhr-zahl">11</text><text x="-0.0" y="-60.0" class="uhr-zahl">12</text></g>
    <g class="zeiger zeiger-stunde" transform="rotate(305)" filter="url(#u1-schatten)">
