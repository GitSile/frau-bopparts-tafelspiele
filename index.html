<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frau Bopparts Tafelspiele</title>
  <meta name="description" content="Lernspiele für die digitale Schultafel">
  <!-- Vorschau beim Teilen (WhatsApp, Teams, E-Mail …) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Frau Bopparts Tafelspiele">
  <meta property="og:description" content="Lernspiele für die digitale Schultafel">
  <meta property="og:url" content="https://boppart.info/">
  <meta property="og:image" content="https://boppart.info/vorschau.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="stylesheet" href="gemeinsam/filz.css">
  <style>
    body { background: #fdf6e3; min-height: 100%; }
    .seite { max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; }
    .kopf { text-align: center; margin-bottom: 36px; }
    .kopf h1 { margin: 0; font-size: clamp(40px, 6vw, 72px); font-weight: 900; color: #e65100; }
    .kopf p { margin: 8px 0 0; font-size: 22px; color: #546e7a; font-weight: 600; }

    .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px; }
    .kachel {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: #fff; padding: 22px 22px 26px; text-decoration: none; color: inherit;
      --filz-dicke: 5px; --filz-farbe: var(--farbe, var(--strich));
      transition: transform .15s;
    }
    .kachel:hover, .kachel:focus-visible { transform: rotate(-1.2deg) scale(1.03); outline: none; }
    .kachel:active { transform: scale(.98); }
    .kachel-bild { width: 190px; height: 190px; display: grid; place-items: center; position: relative; }
    .kachel-bild img { width: 100%; height: 100%; max-height: 190px; object-fit: contain; }
    /* kleines Zusatzbild vorne unten, z. B. der Ball vor dem Löwen */
    .kachel-bild img.vorne { position: absolute; width: 58px; height: 58px; right: 18px; bottom: 0; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
    .kachel h2 { margin: 10px 0 4px; font-size: 32px; font-weight: 900; color: var(--farbe, #1d2733); }
    .hinweise { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .fach { display: inline-block; padding: 4px 14px; border-radius: var(--wackel-klein); background: var(--farbe-hell, #eceff1); font-weight: 800; font-size: 16px; }
    .modus { background: #fff; border: 2px solid var(--farbe, #546e7a); color: var(--farbe, #546e7a); padding: 2px 12px; }
    .kachel p { margin: 0 0 18px; font-size: 18px; color: #455a64; line-height: 1.35; }
    .kachel .knopf { pointer-events: none; margin-top: auto; line-height: 1.4; }  /* Knopf immer unten: alle Knöpfe einer Reihe auf derselben Höhe */
    .kachel.bald { opacity: .55; pointer-events: none; --filz-farbe: #b0bec5; }
    /* Spiel im Testmodus: normal anklickbar, mit rotem Hinweis «Testmodus» bei den Fächern */
    .test { background: #d32f2f; color: #fff; }
    .kachel.bald .kachel-bild { font-size: 110px; }
    /* Archiv-Ordner: grau hinterlegt, öffnet sich beim Antippen und zeigt die archivierten Spiele */
    .kachel.ordner { background: #f1f3f5; --filz-farbe: #90a4ae; cursor: pointer; font: inherit; border: 0; }
    .kachel.ordner h2 { color: #546e7a; }
    .kachel.ordner .knopf { background: #78909c; color: #fff; --filz-farbe: #546e7a; }
    .archiv { margin-top: 28px; padding: 26px; background: #f1f3f5; border-radius: var(--wackel-klein, 18px); }
    .archiv[hidden] { display: none; }
    .archiv h3 { margin: 0 0 18px; font-size: 26px; font-weight: 900; color: #546e7a; text-align: center; }
    .kachel.arbeit { opacity: .85; }
    .kachel.arbeit h2 { font-size: 28px; }
    .kachel.arbeit .kachel-bild { width: 100%; }
    footer { margin-top: 48px; text-align: center; color: #78909c; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Filzstift-Effekt für alle Ränder -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="filz" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="rauschen"/>
      <feDisplacementMap in="SourceGraphic" in2="rauschen" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main class="seite">
    <header class="kopf">
      <h1>Frau Bopparts Tafelspiele</h1>
      <p>Lernspiele für die digitale Schultafel</p>
    </header>

    <nav class="kacheln" id="kacheln" aria-label="Spiele"></nav>

    <footer>© 2026 Silvan Hunkeler. Alle Rechte vorbehalten.<br>Schrift: Deutschschweizer Basisschrift © NW EDK / EDK-Ost / BKZ</footer>
  </main>

  <script>
    /* =========================================================
       Liste aller Spiele.
       Für ein neues Spiel einfach einen weiteren Eintrag ergänzen.
       modus: Hinweis-Kachel mit der Anzahl Personen, z. B. «1 Person» (leer lassen, wenn keiner)
       farbe: vorerst bei allen Grün (später eine Farbe pro Fach)
       bald: true = Spiel noch im Test: anklickbar, mit rotem Hinweis «Testmodus»
       archiv: true = Spiel liegt im grauen Archiv-Ordner (sichtbar erst nach Antippen des Ordners)
       ========================================================= */
    const SPIELE = [
      {
        name: 'Mathe-Fussball',
        fach: 'Mathematik',
        modus: '2 Personen',   // Hinweis-Kachel unter dem Titel (leer lassen, wenn keiner)
        text: '',
        link: 'spiele/mathe-fussball/index.html',
        bild: 'spiele/mathe-fussball/bilder/figuren/loewe-jubel.png',
        vorne: 'spiele/mathe-fussball/bilder/ball.png',   // Zusatzbild vorne unten (leer lassen, wenn keins)
        farbe: '#2e7d32'
      },
      {
        name: 'Mathe-Erlebnisse',
        fach: 'Mathematik',
        modus: '1 Person',
        text: '',
        link: 'spiele/mathe-wanderung/index.html',
        bild: 'spiele/mathe-wanderung/bilder/baer-wandern.png',
        farbe: '#2e7d32',
        bald: true
      },
      {
        name: 'Uhr lesen',
        fach: 'Mathematik',
        modus: '1 oder 2 Personen',
        text: '',
        link: 'spiele/uhr-lesen/index.html',
        bild: 'spiele/uhr-lesen/bilder/kachel-fuchs.png',
        farbe: '#2e7d32',
        bald: true
      },
      {
        name: 'Einkaufen',
        fach: 'Mathematik',
        modus: '1 oder 2 Personen',
        text: '',
        link: 'spiele/einkaufen/index.html',
        bild: 'spiele/einkaufen/bilder/elefant-korb.png',
        farbe: '#2e7d32',
        bald: true
      },
      {
        name: 'Wasser-Tiere-Quiz',
        fach: 'NMG',
        modus: '1 Person',
        text: '',
        link: 'spiele/wasser-tiere-quiz/index.html',
        bild: 'spiele/wasser-tiere-quiz/kachel-boppi.png',
        farbe: '#0277bd',
        archiv: true   // liegt im Archiv-Ordner
      }
    ];

    const kacheln = document.getElementById('kacheln');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const kachel = s => `
      <a class="kachel filz" href="${esc(s.link)}" style="--farbe:${s.farbe}; --farbe-hell:${s.farbe}22">
        <div class="kachel-bild"><img src="${esc(s.bild)}" alt="">${s.vorne ? `<img class="vorne" src="${esc(s.vorne)}" alt="">` : ''}</div>
        <h2>${esc(s.name)}</h2>
        <div class="hinweise">
          <span class="fach">${esc(s.fach)}</span>
          ${s.modus ? `<span class="fach modus">${esc(s.modus)}</span>` : ''}
          ${s.bald ? '<span class="fach test">Testmodus</span>' : ''}
        </div>
        ${s.text ? `<p>${esc(s.text)}</p>` : ''}
        <span class="knopf gross filz">Spielen ▶</span>
      </a>`;
    const archiviert = SPIELE.filter(s => s.archiv);
    kacheln.innerHTML = SPIELE.filter(s => !s.archiv).map(kachel).join('') + `
      <div class="kachel bald arbeit filz" aria-hidden="true">
        <div class="kachel-bild"><img src="bilder/baustelle.png" alt=""></div>
        <h2>Weitere Spiele sind in Arbeit.</h2>
      </div>` + (archiviert.length ? `
      <button type="button" class="kachel ordner filz" id="ordner" aria-expanded="false" aria-controls="archiv">
        <div class="kachel-bild"><img src="bilder/archiv.svg" alt="" style="width:160px"></div>
        <h2>Archiv</h2>
        <span class="knopf gross filz" id="ordner-knopf">Öffnen</span>
      </button>` : '');
    if (archiviert.length) {
      const archiv = document.createElement('section');
      archiv.className = 'archiv'; archiv.id = 'archiv'; archiv.hidden = true;
      archiv.innerHTML = '<h3>Archiv</h3><nav class="kacheln" aria-label="Archivierte Spiele">' + archiviert.map(kachel).join('') + '</nav>';
      kacheln.after(archiv);
      const ordner = document.getElementById('ordner');
      ordner.addEventListener('click', () => {
        archiv.hidden = !archiv.hidden;
        ordner.setAttribute('aria-expanded', String(!archiv.hidden));
        document.getElementById('ordner-knopf').textContent = archiv.hidden ? 'Öffnen' : 'Schliessen';
        if (!archiv.hidden) archiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
  </script>
  <script data-goatcounter="https://sile.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
